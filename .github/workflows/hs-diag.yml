name: Hootsuite access diagnostic (one-off, manual)

# One-off, read-only: shows the SHAPE of what the Hootsuite API lets our token see (orgs, profile counts,
# teams, HTTP errors) to find out why some connected accounts are missing. Prints counts only, no names.
# Manual trigger only; no repo writes. Shares the single-use Hootsuite token chain, so same concurrency
# group + token save-back as the other Hootsuite jobs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-hootsuite
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Set Hootsuite state file path
        run: echo "HOOTSUITE_STATE_FILE=$RUNNER_TEMP/hootsuite_state.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud-hootsuite

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run access diagnostic (structure and counts only)
        working-directory: cloud-hootsuite
        env:
          HOOTSUITE_CLIENT_ID: ${{ secrets.HOOTSUITE_CLIENT_ID }}
          HOOTSUITE_CLIENT_SECRET: ${{ secrets.HOOTSUITE_CLIENT_SECRET }}
          HOOTSUITE_REFRESH_TOKEN: ${{ secrets.HOOTSUITE_REFRESH_TOKEN }}
        run: node diag_access.mjs

      - name: Save rotated Hootsuite refresh token back to the secret
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f "$HOOTSUITE_STATE_FILE" ]; then
            node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.env.HOOTSUITE_STATE_FILE,'utf8')).refreshToken)" \
              | gh secret set HOOTSUITE_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
            echo "Refresh token saved."
          else
            echo "No token rotation happened this run; nothing to save."
          fi

