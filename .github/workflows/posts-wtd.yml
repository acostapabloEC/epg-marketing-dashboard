name: Nightly posts week-to-date (Posting Volume dashboard)

# Feeds the Posting Volume dashboard (acostapabloEC/epg-posts-dashboard) with post counts for
# Instagram, YouTube and Facebook: the previous complete week (final numbers) + this week so far.
# Runs ~11pm US Eastern so today's posts are in by tomorrow morning.
#
# Shares the ONE Hootsuite OAuth chain with weekly-hootsuite.yml (single-use refresh token), so it
# uses the same concurrency group, and the rotated token is saved back to the
# HOOTSUITE_REFRESH_TOKEN secret at the end (always, even on failure). NEVER run these Hootsuite
# scripts on the laptop.
#
# Secrets (this repo): HOOTSUITE_CLIENT_ID, HOOTSUITE_CLIENT_SECRET, HOOTSUITE_REFRESH_TOKEN, GH_PAT
# (token save only), POSTS_DEPLOY_KEY (SSH deploy key with write access to epg-posts-dashboard only).
on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC = 11pm US Eastern (EST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pull + merge only; do not push to the dashboard'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-hootsuite
  cancel-in-progress: false

jobs:
  wtd:
    runs-on: ubuntu-latest
    steps:
      - name: Set Hootsuite state file path
        run: echo "HOOTSUITE_STATE_FILE=$RUNNER_TEMP/hootsuite_state.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: cloud-hootsuite
          path: main

      - uses: actions/checkout@v4
        with:
          repository: acostapabloEC/epg-posts-dashboard
          ssh-key: ${{ secrets.POSTS_DEPLOY_KEY }}
          path: posts

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pull Instagram / YouTube / Facebook (previous week + this week so far)
        working-directory: main/cloud-hootsuite
        env:
          HOOTSUITE_CLIENT_ID: ${{ secrets.HOOTSUITE_CLIENT_ID }}
          HOOTSUITE_CLIENT_SECRET: ${{ secrets.HOOTSUITE_CLIENT_SECRET }}
          HOOTSUITE_REFRESH_TOKEN: ${{ secrets.HOOTSUITE_REFRESH_TOKEN }}
        run: node posts_wtd.mjs "$RUNNER_TEMP/posts_wtd.json"

      # Must run even if the pull failed: the first API call already burned the old token.
      - name: Save rotated Hootsuite refresh token back to the secret
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f "$HOOTSUITE_STATE_FILE" ]; then
            node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.env.HOOTSUITE_STATE_FILE,'utf8')).refreshToken)" \
              | gh secret set HOOTSUITE_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
            echo "Refresh token saved."
          else
            echo "No token rotation happened this run; nothing to save."
          fi

      - name: Merge into the dashboard data
        run: node main/cloud-hootsuite/apply_posts_wtd.mjs "$RUNNER_TEMP/posts_wtd.json" posts/src/posts-data.json

      - name: Show what changed
        run: |
          cd posts
          git diff --stat
          cp "$RUNNER_TEMP/posts_wtd.json" "$GITHUB_WORKSPACE/posts_wtd.json"

      - uses: actions/upload-artifact@v4
        with:
          name: posts-wtd
          path: posts_wtd.json

      - name: Commit and push to the dashboard repo
        if: ${{ !inputs.dry_run }}
        run: |
          cd posts
          git config user.name "Pablo Acosta"
          git config user.email "pabloacosta@eliteconsultingpartners.com"
          if git diff --quiet; then echo "No changes."; exit 0; fi
          git add src/posts-data.json
          git commit -m "Data: nightly posts week-to-date ($(date -u +%F))"
          for i in 1 2 3; do
            git push && exit 0
            # Someone else pushed meanwhile: take theirs, re-apply our (idempotent) merge, retry.
            git fetch origin main && git reset --hard origin/main
            node ../main/cloud-hootsuite/apply_posts_wtd.mjs "$RUNNER_TEMP/posts_wtd.json" src/posts-data.json
            git add src/posts-data.json
            git commit -m "Data: nightly posts week-to-date ($(date -u +%F))" || exit 0
          done
          echo "Push failed after 3 attempts"; exit 1
